name: Deploy landing to Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: web
        # Pages serves this repository under /parallax, so every absolute URL
        # the framework emits has to carry that prefix. Building without it
        # produces a page that works on localhost and 404s every asset here.
        env:
          NEXT_PUBLIC_BASE_PATH: /parallax
        run: bun run build

      - name: The export has to contain both pages
        working-directory: web
        # A Pages deploy that publishes an empty or half-built directory is
        # still a green check. These are the two files whose absence is the
        # whole failure, so they are asserted rather than assumed.
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/proof/index.html || { echo "::error::out/proof/index.html missing"; exit 1; }
          test -f out/.nojekyll || { echo "::error::out/.nojekyll missing"; exit 1; }
          echo "export ok: $(find out -type f | wc -l) files"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - id: deployment
        uses: actions/deploy-pages@v4
